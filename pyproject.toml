[tool.poetry]
name = "paymemo"
version = "0.1.0"
description = "Api para consumo da PayMemo-WEB e controle de contas pessoais."
authors = ["Danillo Souza Pereira <danillodesouza03@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
packages = [{ include = "paymemo", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9"
fastapi = "^0.119"
pydantic = "^2.12"
uvicorn = "^0.37"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4"
httpx = "^0.28"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
